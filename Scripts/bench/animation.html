<!doctype html>
<meta charset="utf-8">
<title>Dropy bench animation</title>
<style>html, body { margin: 0; height: 100%; background: #111; } canvas { display: block; }</style>
<canvas id="c"></canvas>
<script>
  // Display-rate full-window motion, standing in for video-like content.
  // It exercises capture and composition, not a media decoder.
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  function resize() { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; }
  addEventListener("resize", resize); resize();
  let frame = 0;
  function draw() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = "#111"; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 40; i++) {
      const t = frame / 60 + i;
      ctx.fillStyle = `hsl(${(i * 29 + frame) % 360} 80% 60%)`;
      ctx.beginPath();
      ctx.arc(w / 2 + Math.cos(t * 0.9) * w * 0.4, h / 2 + Math.sin(t * 1.3) * h * 0.4, 20 + i, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#fff"; ctx.font = `${24 * devicePixelRatio}px monospace`;
    ctx.fillText(`frame ${frame++}`, 20, 40 * devicePixelRatio);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
