name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: swift --version
      - name: Swift package build
        run: swift build
      - name: Swift package tests
        run: swift test
      - name: App bundle build
        run: ./Scripts/build-local.sh
      - name: Local checks
        run: ./Scripts/test-local.sh
      - name: Validate bundle
        run: |
          plutil -lint .build/local/Dropy.app/Contents/Info.plist
          python3 -m json.tool .build/local/Dropy.app/Contents/Resources/InputEvidence.json > /dev/null
          codesign --verify --deep --strict .build/local/Dropy.app
