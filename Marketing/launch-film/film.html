<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dropy Launch Film</title>
<style>
  :root { --bg: #000; --fg: #f5f5f7; --dim: #8e8e93; --line: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  #film { display: block; width: min(100%, calc((100vh - 90px) * 16 / 9)); aspect-ratio: 16 / 9; height: auto; background: #000; border-radius: 10px; }
  .bar { width: min(100%, calc((100vh - 90px) * 16 / 9)); display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--dim); }
  .bar button { appearance: none; border: 1px solid var(--line); background: #0d0d0f; color: var(--fg); border-radius: 999px; padding: 7px 16px; font: inherit; cursor: pointer; min-width: 78px; }
  .bar input { flex: 1; accent-color: #f5f5f7; }
  .bar span { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  body.render { padding: 0; display: block; overflow: hidden; }
  body.render #film { width: 1920px; height: 1080px; border-radius: 0; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<canvas id="film" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play" type="button">Pause</button>
  <input id="scrub" type="range" min="0" max="50" step="0.01" value="0" aria-label="Position">
  <span id="clock">0.00 / 50.00</span>
</div>
<script>
'use strict';
// Dropy launch film. Every frame is a pure function of time, so the browser preview
// and the frame-by-frame render (render.mjs) show exactly the same film.

const W = 1920, H = 1080, DUR = 47.9;
// The timeline below is written in story seconds; SPEEDS sets how fast it plays back.
// Two scenes are inserted into it at story times `at`; while one plays, the main
// timeline holds still and the scene draws over the same screen.
const INSERTS = [{ at: 8.1, dur: 8.5, kind: 'edges' }, { at: 16.85, dur: 6.6, kind: 'montage' }];

const EXTRA = INSERTS.reduce((a, b) => a + b.dur, 0);
// Stretches cut out of the story: a beat of stillness before the edges scene, where an
// app picker used to be, a full-screen demo, and an empty desktop before the finale.
const CUTS = [{ at: 8.15, len: .4 }, { at: 10.4, len: 2.2 }, { at: 15.0, len: 1.8 }, { at: 20.95, len: 7.3 }, { at: 36.25, len: 3.55 }];
const CUT_LEN = CUTS.reduce((a, c) => a + c.len, 0);
const cutOf = o => { let c = o; for (const C of CUTS) c -= clamp(o - C.at, 0, C.len); return c; };
const uncut = c => { let o = c; for (const C of CUTS) if (o > C.at) o += C.len; return o; };
const TOTAL = DUR - CUT_LEN + EXTRA;
// Playback speed, as [master second, speed] keys (master seconds: the story with the
// scenes in it), eased from key to key. The quiet opening and the edges run quickest,
// the busy app scenes and the Motion section closer to real time, so the film keeps
// one even pace; the end card plays at real time so it can be read.
const SPEEDS = [
  [0, 2.0], [5.0, 2.0], [6.2, 1.6], [7.9, 1.6], // the opening; "Meet Dropy."
  [8.6, 1.75], [16.2, 1.75],                    // the edges scene (8.1–16.6)
  [17.0, 1.55], [20.4, 1.55],                   // "Even the notch." and Notes
  [21.3, 1.28], [39.95, 1.28],                  // the montage, the shortcut, Motion, the lift
  [43.85, 1], [TOTAL, 1],                       // the end card
];
const speedAt = m => {
  let k = 0;
  while (k < SPEEDS.length - 2 && m >= SPEEDS[k + 1][0]) k++;
  const [a, sa] = SPEEDS[k], [b, sb] = SPEEDS[k + 1], u = Math.min(1, Math.max(0, (m - a) / (b - a)));

};
// Real seconds <-> master seconds, through a table of real time at every STEP of master time.
const STEP = .002, RT = [0];
for (let i = 0; i * STEP < TOTAL + 1; i++) RT.push(RT[i] + STEP / speedAt((i + .5) * STEP));

const REAL_DUR = realOf(TOTAL);
function toMaster(o) { const c = cutOf(o); let m = c; for (const I of INSERTS) if (c > cutOf(I.at)) m += I.dur; return m; }
const insertStart = I => toMaster(I.at);
function locate(m) {
  let shift = 0;
  for (const I of INSERTS) {
    const start = cutOf(I.at) + shift;
    if (m < start) break;
    if (m < start + I.dur) return { o: I.at, ins: I, l: m - start };
    shift += I.dur;
  }

// Story seconds to real seconds, for the score.
const real = o => realOf(toMaster(o));
// Per-frame state: an ambient clock that never holds, and
// overrides the inserted scenes set.
const BPM = 96, BEAT = 60 / BPM;
let AMB = 0, SHELL_EDGE = 1, SHELL_BODY = 0, MENU_APP = null, NOTCH_JIGGLE = { w: 0, h: 0 };
const cv = document.getElementById('film');
const ctx = cv.getContext('2d');
const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif';
const FG = '245,245,247';

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {

// Damped spring from 0 to 1, `t` seconds after it starts.
function spring(t, w = 14, z = .72) {

  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
function rng(seed) {

    seed |= 0; seed = seed + 0x6D2B79F5 | 0;

}
const lerpRect = (a, b, u) => ({ x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), w: lerp(a.w, b.w, u), h: lerp(a.h, b.h, u) });

// ---------- paths ----------
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function polyPath(g, pts) {
  g.beginPath();
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
}
function arcPts(P, cx, cy, r, a0, a1, n = 18) {
  for (let i = 1; i <= n; i++) { const a = lerp(a0, a1, i / n); P.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
}
function quadPts(P, qx, qy, x, y, n = 12) {
  const [x0, y0] = P[P.length - 1];

    const u = i / n, q = 1 - u;
    P.push([q * q * x0 + 2 * q * u * qx + u * u * x, q * q * y0 + 2 * q * u * qy + u * u * y]);

function resample(pts, n, closed) {

    const d = closed ? total * k / n : total * k / (n - 1);

// ---------- morphing ----------
// Every morphing shape is N points, one closed loop. Open strokes (the line, the glyph)
// run out and back, so stroking them draws the stroke and they can still inflate into
// a filled outline.
const N = 560;
const symPhase = i => i < N / 2 ? i / (N / 2) : (N - 1 - i) / (N / 2);
function doubled(open) { const half = resample(open, N / 2, false); return half.concat(half.slice().reverse()); }
function roundedPolyline(vs, radii) {
  const out = [vs[0]];
  for (let i = 1; i < vs.length - 1; i++) {
    const [px, py] = vs[i - 1], [x, y] = vs[i], [nx, ny] = vs[i + 1];
    const d1 = Math.hypot(x - px, y - py), d2 = Math.hypot(nx - x, ny - y);
    const a = Math.min(radii[i] || 0, d1 / 2, d2 / 2);
    const ix = x - (x - px) / d1 * a, iy = y - (y - py) / d1 * a;
    const ox = x + (nx - x) / d2 * a, oy = y + (ny - y) / d2 * a;
    out.push([ix, iy]);
    for (let k = 1; k <= 14; k++) {
      const u = k / 14, q = 1 - u;
      out.push([q * q * ix + 2 * q * u * x + u * u * ox, q * q * iy + 2 * q * u * y + u * u * oy]);
    }
  }
  out.push(vs[vs.length - 1]);

}
// The Dropy mark, traced from the app icon: a line that drops into a box.
const GLYPH_V = [[305, 490], [455, 490], [630, 790], [945, 790], [945, 490], [655, 490]];
const GLYPH_R = [0, 34, 38, 58, 58, 0];
const GLYPH_D = doubled(roundedPolyline(GLYPH_V, GLYPH_R).map(([x, y]) => [(x - 625) / 640, (y - 640) / 640]));
const glyphAt = (cx, cy, w) => GLYPH_D.map(([x, y]) => [cx + x * w, cy + y * w]);
// The mark's path as segments (length, direction), for folding it out of a straight line.
const FOLD = (() => {
  const P = roundedPolyline(GLYPH_V, GLYPH_R).map(([x, y]) => [(x - 625) / 640, (y - 640) / 640]);
  const Q = resample(P, 420, false), segs = [];
  let prev = 0;
  for (let i = 0; i < Q.length - 1; i++) {
    const dx = Q[i + 1][0] - Q[i][0], dy = Q[i + 1][1] - Q[i][1];
    let a = Math.atan2(dy, dx);

// The folded path at `v` (0 straight, 1 the mark), drawn `w` wide and centred on c.

const GLYPH_O = resample(roundedPolyline(GLYPH_V, GLYPH_R).map(([x, y]) => [(x - 625) / 640, (y - 640) / 640]), 420, false);

// The notch and the overlay it opens into: flush with the top edge, concave ears where

// Rotate B's starting point to sit closest to A's, so a morph never twists.
function align(A, B) {

// ---------- text ----------
const layouts = new Map();
function layout(text, font, track) {
  const key = font + '|' + track + '|' + text;

  if (!L) {
    ctx.font = font;
    const xs = [];
    for (let i = 0; i <= text.length; i++) xs.push(ctx.measureText(text.slice(0, i)).width + i * track);
    L = { xs, width: xs[text.length] - track };

// Text that arrives letter by letter out of a blur and leaves upward into one.
function animText(t, o) {
  const font = `${o.weight || 600} ${o.size}px ${FONT}`;

// ---------- timeline ----------
// The overlay's openness: springs added together, so a new target picks up the motion
// already under way, the way Dropy's own morph does.
const OPEN = { w: 12.5, z: .74 }, SHUT = { w: 18, z: .9 };

const KW_W = 1.12, KZ_W = .9, KW_H = .92, KZ_H = 1;

const OPEN_DELAY = .2;
const STYLES = [

  { name: 'Balanced', w: 15, z: .70, response: '0.32 s' },
  { name: 'Smooth', w: 8.5, z: .83, response: '0.56 s' },

const SEL = [29.75, 31.6, 33.45];
const OEV = [

  ...SEL.flatMap((s, i) => [[s + OPEN_DELAY, 1, STYLES[i]], [s + OPEN_DELAY + 1.2, 0, STYLES[i]]]),

function openness(t) {
  let v = 0, prev = 0;

    v += (to - prev) * spring(t - te, s.w, s.z);

// Width and height follow their own springs, so opening squashes and stretches.
function opennessWith(t, kw, kz) {

}

// Camera: world (a 1920×1080 screen) to film. Opens close on the notch, settles to
// full bleed, pulls back to show the display for Motion, then returns.
// The camera leans in on the typing, twice, so the words can be read, then eases back.
const PUSHES = [{ a: 12.65, b: 13.4, c: 14.35, d: 14.95, k: .42, at: [860, 330] }];

  const cam = baseCamera(t);

const CUR = [[12.6, 1290, 760], [13.2, 828, 360], [13.5, 828, 360],

// The music's pulse starts as Dropy first opens, at the right edge.
const gridStart = () => realOf(insertStart(INS.edges) + STOPS[0].a);

// ---------- end titles ----------
// "Dropy": each letter drops out from under the icon, falling faster as it goes,
// stretched by the fall, and lands with a small squash before it settles.
const DROP = { text: 'Dropy', size: 128, track: -4, base: 718, t0: 41.2, gap: .085, fall: .42 };
const dropLand = i => DROP.t0 + i * DROP.gap + DROP.fall;
function dropWord(t) {
  const font = `700 ${DROP.size}px ${FONT}`, L = layout(DROP.text, font, DROP.track);
  const x0 = 960 - L.width / 2, top = ICON.y + ICON.h - 6;
  ctx.save();
  // Only below the icon: the letters seem to come out from underneath it.
  ctx.beginPath(); ctx.rect(0, top, W, H - top); ctx.clip();
  ctx.font = font; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = `rgb(${FG})`;
  for (let i = 0; i < DROP.text.length; i++) {

  const font = `${weight} ${size}px ${FONT}`, L = layout(s, font, -.3), x0 = x - L.width / 2;

  if (u <= 0) return;

  ctx.globalAlpha = u;

  ctx.restore();
}

// ---------- finishing ----------
const grain = document.createElement('canvas');
grain.width = grain.height = 256;
{
  const gg = grain.getContext('2d'), img = gg.createImageData(256, 256), r = rng(42);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 7; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }

}
let vignette;
function finish(t, rt) {
  if (!vignette) {

function render(rt) {
  const m = masterOf(rt), L = locate(m), t = L.o;

  });
  BUBBLES.forEach(([side, , t0]) => pop(at('montage', 1.85 + t0), side === 'r' ? 86 : 81, .75));
  HANDOFFS.forEach(([T], i) => tick(at('montage', T + .4), .55));
  for (const [kind, s, t0] of TERM) {
    if (kind === '$') for (let j = 0; j < s.length; j++) key(at('montage', 3.35 + t0 + j / TYPE_RATE), .55);
    else tick(at('montage', 3.35 + t0), .8);
  }
  boing(at('montage', 4.85), .9);
  // Scene two: the bead's run pans across the speakers; each position thumps open.
  for (const F of FLOWS) sweep(at('edges', F.d), at('edges', F.d + FLOW) - at('edges', F.d), F.x0, F.x1, .7);
  for (const S of STOPS) {
    thump(at('edges', S.a), .7);
    pop(at('edges', S.a + .05), 81, .45);
  }
  boing(at('edges', HOME.a), .6);
}
let scorePromise;
function renderScore(sampleRate = 48000) {
  if (!scorePromise) {
    const ac = new OfflineAudioContext(2, Math.ceil(REAL_DUR * sampleRate), sampleRate);
    compose(ac);
    scorePromise = ac.startRendering();
  }
  return scorePromise;
}
// The score as 16-bit stereo PCM in base64, for render.mjs.
window.scorePCM = async () => {
  const buf = await renderScore();
  const L = buf.getChannelData(0), Rc = buf.getChannelData(1), out = new Int16Array(L.length * 2);
  let peak = 0;
  for (let i = 0; i < L.length; i++) {
    peak = Math.max(peak, Math.abs(L[i]), Math.abs(Rc[i]));
    out[2 * i] = Math.max(-1, Math.min(1, L[i])) * 32767;
    out[2 * i + 1] = Math.max(-1, Math.min(1, Rc[i])) * 32767;
  }
  const bytes = new Uint8Array(out.buffer);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { sampleRate: buf.sampleRate, peak, data: btoa(s) };
};

// ---------- playback ----------
const acc = document.createElement('canvas');
acc.width = cv.width; acc.height = cv.height;
const accg = acc.getContext('2d');
function renderBlurred(rt, n = 4, shutter = .5) {
  if (n <= 1) return render(rt);
  for (let i = 0; i < n; i++) {
    render(rt + ((i + .5) / n - .5) * shutter / 60);
    accg.globalAlpha = 1 / (i + 1); accg.drawImage(cv, 0, 0);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(acc, 0, 0);
}
const SUB = +(new URLSearchParams(location.search).get('sub') || 1);
window.renderAt = t => renderBlurred(t, SUB);
window.FILM = { duration: REAL_DUR, fps: 60 };
if (new URLSearchParams(location.search).has('render')) {
  document.body.classList.add('render');
} else {
  const play = document.getElementById('play'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
  scrub.max = REAL_DUR;
  let playing = false, t0 = performance.now(), pos = 0, audio, voice;
  const seek = t => { pos = t; t0 = performance.now() - t * 1000; };
  const stopVoice = () => { if (voice) { voice.stop(); voice = null; } };
  async function startVoice() {
    stopVoice();
    audio = audio || new AudioContext();
    const buf = await renderScore(audio.sampleRate);
    if (!playing) return;
    voice = audio.createBufferSource(); voice.buffer = buf; voice.connect(audio.destination);
    voice.start(0, pos);
    seek(pos);
  }
  const setPlaying = p => {
    playing = p; play.textContent = p ? 'Pause' : 'Play';
    if (p) { seek(pos >= REAL_DUR ? 0 : pos); startVoice(); } else stopVoice();
  };
  play.onclick = () => setPlaying(!playing);
  scrub.oninput = () => { seek(+scrub.value); render(pos); if (playing) startVoice(); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); } });
  const tick = now => {
    if (playing) { pos = (now - t0) / 1000; if (pos >= REAL_DUR) { pos = REAL_DUR; setPlaying(false); } render(pos); scrub.value = pos; }
    clock.textContent = `${pos.toFixed(2)} / ${REAL_DUR.toFixed(2)}`;
    requestAnimationFrame(tick);
  };
  render(0);
  play.textContent = 'Play';
  requestAnimationFrame(tick);
}
</script>
